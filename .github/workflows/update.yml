name: Weekly YouTube Update

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Create cookies file
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
      
      - name: Install dependencies
        run: |
          pip install google-api-python-client yt-dlp openai streamlit pandas youtube-transcript-api
      
      - name: Run fetch script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python fetch_videos.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update videos"
          git push
